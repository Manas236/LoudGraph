# All tunables for the pipeline. Secrets go in .env, never here.

brand:
  name: "Graphony"              # product name (dashboard, Telegram, README); never on the video unless render.watermark

paths:                          # relative to the project root
  cache: cache
  out: out
  tokens: tokens
  db: pipeline.db
  fonts: assets/fonts
  flags: assets/flags
  topics_auto: topics_auto.yaml   # topics the autopilot discovered (discover.py); server state, not in git
  migrated_marker: MIGRATED_TO_SERVER   # while this file exists nothing posts from this machine (autopilot.py)

cache_days: 30                  # re-fetch a cached series only when older than this

data:
  owid_grapher_url: "https://ourworldindata.org/grapher/{slug}.csv?v=1&csvType=full&useColumnShortNames=true"
  owid_metadata_url: "https://ourworldindata.org/grapher/{slug}.metadata.json?v=1&csvType=full&useColumnShortNames=true"
  owid_bulk:                    # used by topics whose code starts with "github:<dataset>/"
    energy-data: "https://raw.githubusercontent.com/owid/energy-data/master/owid-energy-data.csv"
    co2-data: "https://raw.githubusercontent.com/owid/co2-data/master/owid-co2-data.csv"
  owid_codebook:                # column titles + original sources for the bulk datasets
    energy-data: "https://raw.githubusercontent.com/owid/energy-data/master/owid-energy-codebook.csv"
    co2-data: "https://raw.githubusercontent.com/owid/co2-data/master/owid-co2-codebook.csv"
  http_timeout: 60
  verify_min_countries: 25      # topics-verify: usable pool countries required to keep a topic
  max_stale_years: 3            # a series must reach within N years of the topic's latest year
  max_late_start_years: 3       # ...and start within N years of start_year

video:
  width: 1080
  height: 1920
  fps: 30
  crf: 18
  preset: medium
  audio_bitrate: 192k
  min_seconds: 20               # target length, end card included: the timeline is fitted (timing.fit) and the
  max_seconds: 23.3             # picker drops countries to stay inside it; a timeline outside it is re-picked. A reel
                                # WITHOUT a cold open is at most max_seconds ...
  max_seconds_cold_open: 25.0   # ... and one with a cold open (max_seconds + cold_open.seconds + snap_seconds) at most this
  format_version: 2             # the experiment marker every NEW reel is rendered with (meta.json, runs, posts):
                                # 2 = two slots a day, "Which country...?" hooks only, <= 23.3 s. `run.py coldopen`
                                # compares the cold-open A/B within this version

timing:                         # timeline.py is the only consumer; everything else reads the timeline
  intro: 0.0                    # 0 = the first country's line moves from frame 0 (the hook is drawn over it)
  per_country: 4.2              # includes the transition and the end hold (~0.1 s per year, as before)
  transition: 0.35              # whoosh + crossfade at the start of each country after the first
  hold: 0.4                     # line finished, final value on screen
  end_card: 2.5                 # reveals the answer to the opening question
  hook_hold: 2.5                # the opening question stays big this long ...
  hook_shrink: 0.45             # ... then shrinks into the header that stays for the whole video
  event_threshold: 0.25         # a year-to-year move >= 25% of the country's range is an EVENT
  event_slowmo: 3.0             # ...and the step into it lasts 3x longer (video + audio)
  fit:                          # a race longer than video.max_seconds is shortened in this order, only as far as needed
    hold_min: 0.2               # 1. dead time: the end hold of each line ...
    transition_min: 0.2         #    ... and the cross-fade between countries, down to these
    event_slowmo_min: 1.5       # 2. less slow motion on events, down to this factor
    draw_min: 0.9               # 3. a faster line: each country's draw time down to this share of the default
                                # Data years are never cut. Still too long: the picker drops the least interesting
                                # country; at picker.min_countries the topic is skipped, with the reason logged

scorer:
  min_points: 20
  max_gap_years: 2              # consecutive data years further apart than this -> reject
  interp_tol: 0.002             # |2nd diff| <= tol * range counts as straight-line filled-in
  flat_tol: 0.002               # |1st diff| <= tol * range counts as flat
  max_interp_flat: 0.4
  min_swing: 0.15
  reversal_threshold: 0.15      # zigzag leg must move >= 15% of range
  weights:
    swing_max: 35
    swing_full: 1.0             # swing at which the swing component maxes out
    reversals: {0: 8, 1: 25, 2: 30, 3: 25, 4: 15, other: 5}
    shock_max: 25
    shock_full: 0.5             # a single-year move of half the range earns full shock points
    noise_reversals: 6          # with this many reversals the series is noise...
    noise_shock_factor: 0.3     # ...and its shock points are scaled down (big jumps are just noise)
    smooth_max: 10              # (1 - interp) * smooth_max

picker:
  top_k: 20
  min_countries: 4              # fewer passing countries -> run fails "not enough interesting data"
  max_countries: 5              # cap per video; the most interesting by the scorer, dropped to fit max_seconds
  net_up: 0.5
  net_down: -0.5
  reversal_story: 2
  max_attempts: 60              # random restarts when looking for a not-yet-used country set
  require_falling: true         # no country with net < net_down -> run fails "low variety"
  min_variety_distance: 0.25    # min pairwise z-distance below this -> run fails "low variety"

topic_cooldown_days: 10         # same topic may come back (with a different set) after this. 10, not 21: two posts a
                                # day plus dropped reels use ~3 topics a day, and a 21-day rest let the pool run dry

posting:                        # the posting queue (pipeline/posting.py): run by the bot itself, no OS scheduler
  time: ["14:30", "16:00"]      # approved reels post in these daily slots (keep the quotes). Every breakout so far
                                # went out between 14:26 and 16:28 IST, on a day with two posts
  timezone: Asia/Kolkata        # the slots are IST whatever time zone the PC's clock is set to
  min_gap_hours: 1              # a post waits until this long after the last one (Post now, a late post), while its
                                # slot is still open
  late_until: "18:00"           # a missed slot (PC asleep, bot stopped) still posts late until the next slot starts or,
                                # for the last slot, until this time; after that its reel rolls to the next day
  ab_first_day: "2026-10-24"    # the cold-open A/B swaps slots daily: on this day (and every 2nd day after it) the reel
                                # WITH a cold open takes the first slot and the one without the second; the days
                                # between, the other way round

cadence:
  videos_per_day: 2
  posting_times: []             # local 24-hour times; Bot.bat makes the daily videos at these times
  timezone: Asia/Kolkata

audio:
  sample_rate: 48000
  scale: minor_pentatonic       # minor_pentatonic | major_pentatonic | natural_minor | dorian | major
  scale_octaves: 3              # 3 octaves of the scale = 16 notes per country
  # one root per country, cycled. All from A minor pentatonic so the end-card chord of
  # every root has no semitone clashes.
  keys: [A2, C3, E3, G2, D3, A3, E2, G3]
  pluck_register: [48, 55]      # lowest scale note is moved into this MIDI range (C3..G3)
  # --- pluck stem (the lead)
  pluck_t60: 0.3                # short decay (~250 ms audible) so notes do not smear
  pluck_length: 0.35
  pluck_brightness: 0.9         # 1 = raw noise burst (brightest attack)
  pluck_click: 0.25             # 2 ms high-passed pick transient
  move_threshold: 0.15          # a move of >= 15% of the range ...
  move_min_steps: 2             # ... always changes the note by >= 2 scale steps
  run_max_notes: 9              # event scale run: at most this many notes between old and new note
  run_gain: 0.75
  run_t60: 0.18
  event_note_gain: 1.15         # the arrival note of an event
  # --- pad stem (follows the data)
  pad_detune_cents: 3           # total spread of the 3 saws (no audible beating)
  pad_cutoff_min_hz: 180        # cutoff at the country's minimum value ...
  pad_cutoff_max_hz: 2200       # ... and at its maximum
  pad_gain_min: 0.2             # gain at the minimum value (1.0 at the maximum)
  pad_smooth_s: 0.15
  pad_attack: 0.5
  pad_release: 0.7
  duck_level: 0.05              # after a fall the pad drops to this for duck_seconds ("riser-less silence")
  duck_seconds: 0.35
  end_chord_gain: 0.8           # relative to the country pads
  # --- fx stem (relative levels inside the stem)
  whoosh_gain: 0.5
  sub_hit_gain: 1.0             # falls only; sub-bass appears nowhere else
  accent_gain: 0.7              # jumps only
  # --- balance: stems are levelled by measured loudness relative to the pluck stem
  pad_below_pluck_lu: 9         # verification requires >= 6
  fx_below_pluck_lu: 6
  # --- master
  target_lufs: -14.0
  true_peak_db: -1.0            # for the delivered MP4
  aac_headroom_db: 1.3          # AAC still overshoots the bright pluck attacks by ~0.9 dB (PNS is already off)
  master_lowpass_hz: 15000      # band-limit before limiting so AAC does not create new peaks

render:
  backend: auto                 # auto (skia, else pillow) | skia | pillow
  background: "#0b0d12"
  text: "#f5f7fa"
  metric: "#c3cad6"             # the metric + unit line under the opening question
  muted: "#8b93a3"
  grid: "#1f2430"
  # accent per country in a video, in order. Each must reach 4.5:1 contrast on the background.
  palette: ["#22d3ee", "#f472b6", "#a3e635", "#fbbf24", "#a78bfa", "#fb7185", "#34d399", "#fb923c", "#60a5fa"]
  end_card_cta: "Did you guess right?"   # under the end card's answer (the opening questions are in caption_formats.json)
  cover_before_shrink: 0.15     # cover frame (thumb_offset) = this long before the hook starts to shrink
  watermark: false              # true = draw brand.name faintly on every frame; false = the video carries no name

opening:                        # the question every video opens with (on screen from frame 0, then the header)
  hook_template: which_last     # which_last = a guess-the-loser question from `phrasings` (the style of the 2,096-view
                                # breakout reel); who_overtakes = "Who overtakes who?"; auto = the old choice between the top two
  hook_explore_pct: 0           # this % of new reels open with another question instead (the old choice); 0 = none
  recent_block: 3               # a phrasing shown by one of the last 3 reels (posted, then the posting queue, then
                                # Ready for review) is not used again; among the rest the least-used one is picked
  # which_last phrasings: loser questions only. Edit, add or remove freely; every reel stays hook_template which_last
  # (the hook weight is not split) and stores the exact wording as hook_phrase. A phrasing is used only when its
  # `check` is TRUE of the reel's own data (pipeline/hooks.py) and it fits on screen like the first one does:
  #   ends_last      the country with the worst final rank (fields: country, value, year)
  #   falls_most     the biggest fall in value, start to end (country, from, to, from_year, to_year)
  #   drops_to_last  last at the end, NOT last in the first year every country has data (country, rank_from,
  #                  from_year, value, year)
  #   loses_lead     the only country that led at some point and is not first at the end (country, country2 = who
  #                  took the lead, year)
  #   overtaken_most passed by the most countries, at least 2: behind it at the start, ahead at the end (country, n)
  #   loses_ground   the biggest drop in rank start to end, at least 2 places (country, rank_from, rank_to,
  #                  from_year, year)
  # Rank follows the topic's direction (topics.yaml `rank`: highest value first unless lower_first). spatial: true
  # = up/down words (falls, drops, bottom): only for topics ranked highest first, where the chart agrees.
  # `answer` is the end card's line and must answer the question. The first ends_last phrasing is the fallback.
  # Ties in the rotation go by this order, so it alternates the kinds of question.
  # Only "Which country...?" questions (every breakout opened with one; the "Who...?" wordings went 0 for 2).
  phrasings:
    - {text: "Which country ends up last?", check: ends_last, answer: "{country} ends up last: {value} in {year}"}
    - {text: "Which country falls the most?", check: falls_most, spatial: true, answer: "{country} falls the most: {from} to {to}"}
    - {text: "Which country loses the lead?", check: loses_lead, answer: "{country} loses the lead to {country2} in {year}"}
    - {text: "Which country finishes last?", check: ends_last, answer: "{country} finishes last: {value} in {year}"}
    - {text: "Which country sinks to last?", check: drops_to_last, spatial: true, answer: "{country} sinks from {rank_from} in {from_year} to last in {year}"}

cold_open:                      # pipeline/coldopen.py: the reel opens on its most dramatic beat, then rewinds to the start
  mode: thompson                # COLD_OPEN_MODE: thompson | alternate | always | never. thompson = each NEW reel gets one
                                # with the chance that cold opens break out more often (Thompson sampling on the breakout
                                # model, learn.py), kept between autopilot.cold_open_min and _max so both sides keep
                                # being tested; alternate = every other new reel (by render order, kept in the database)
  seconds: 1.5                  # COLD_OPEN_SECONDS: the clip's length. It is ADDED before the race, which stays exactly
                                # as it is without one, so the reel is seconds + snap_seconds longer (<= 25.0 s, as the
                                # race is <= video.max_seconds); a reel that would still pass video.max_seconds_cold_open
                                # is made without one ("skipped: would exceed 25s"), a safety net
  snap_seconds: 0.2             # the rewind cut from the clip back to the start of the race; must be under 0.3
  apply_to_existing_queue: false   # COLD_OPEN_APPLY_TO_EXISTING_QUEUE: false = reels already made are never re-rendered;
                                # true = `python run.py coldopen --apply-queue` may re-render the unposted ones

labels:
  enabled: true
  max_words: 4
  max_chars: 24
  year_tolerance: 1
  shock_threshold: 0.25         # use largest single-year move if it is >= this share of the range

gemini:                         # every call (labels + captions) goes through pipeline/gemini.py
  model: gemini-2.5-flash       # primary ("auto" = list models on first run and pick a flash-class one)
  fallback_models: ["gemini-3.8-flash"]   # tried in order, AT ONCE, when the model before is overloaded (503),
                                # rate limited (429), down (5xx), unknown (404) or does not answer in `timeout`
  prefer: ["flash"]
  avoid: ["lite", "image", "tts", "audio", "live", "thinking", "embedding", "exp", "preview"]
  api_base: "https://generativelanguage.googleapis.com/v1beta"
  timeout: 40                   # seconds per model per call

captions:                       # pipeline/captions.py; hooks in caption_formats.json, tags in hashtags.json
  enabled: true                 # make caption options when a video reaches review
  variants: 3                   # options per video, each from a different hook template
  hook_max_chars: 90            # line 1
  question_max_chars: 80        # line 3
  max_emoji: 1                  # in the hook and question together
  llm: true                     # Gemini picks + fills the templates; false = plain template fills only
  llm_retries: 2                # a Gemini option that fails the checks is asked for again this often, then filled plainly
  use_for_posting: true         # true = the option chosen on the review card is what Instagram/Facebook get;
                                # false = the card only previews it and posts keep the old caption from meta.json
  hashtags:
    count: 5                    # total per video
    broad: 1
    niche: 2                    # the rest is split between topic tags and a country tag
  trending:                     # Instagram hashtag search re-ranks the topic tags by recent top posts
    enabled: false
    weekly_search_budget: 20    # Meta allows 30 unique hashtag searches per account per 7 days
    cache_days: 7
    recent_days: 30

telegram:
  enabled: true                 # the dashboard's Telegram switch. false = the bot leaves the chat alone (no cards,
                                # notes or summaries) but still makes and posts reels; taps made while off are dropped
  poll_timeout: 10             # long-poll seconds while idle (a dashboard decision shows on the card within this)
  busy_poll_timeout: 2          # while a card is posting or a /new video is rendering
  api_base: "https://api.telegram.org"

go_live_test:                   # pass 02 go-live test only: true = really make the public post;
  instagram_post: false         # false = create + upload + wait for FINISHED, stop before media_publish
  facebook_post: false          # false = start + upload, stop before the publishing finish call

dry_run:                        # true = write what would be sent to out/<run>/publish_<platform>.json
  youtube: true
  instagram: false
  facebook: false

youtube:
  enabled: false
  privacy_status: public        # public | unlisted | private
  category_id: "27"             # Education
  max_uploads_per_day: 6
  scopes:
    - https://www.googleapis.com/auth/youtube.upload
    - https://www.googleapis.com/auth/youtube.readonly
    - https://www.googleapis.com/auth/yt-analytics.readonly

instagram:
  enabled: true
  graph_base: "https://graph.facebook.com"
  api_version: "v25.0"           # verified in Meta docs 2026-10-07
  upload_mode: resumable        # resumable (local file) | video_url (needs public_base_url)
  public_base_url: ""           # e.g. https://files.example.com/reels/ -> <base><run_id>.mp4
  share_to_feed: true
  poll_seconds: 30              # Meta suggests ~1 query/min; 30 s keeps it light
  poll_max_minutes: 10

facebook:
  enabled: true                 # optional Page Reels
  graph_base: "https://graph.facebook.com"
  api_version: "v25.0"           # verified in Meta docs 2026-10-07

meta_api:                       # every request to Meta (Instagram + Facebook), from every process
  min_gap_seconds: 3            # a request waits until the one before it is at least this old; 0 = no limit

analytics:
  every_hours: 6                # the bot collects stats this often, in its own process (no OS scheduler)
  summary_every_hours: 24       # ... and sends the Telegram summary at most this often
  min_age_hours: 72
  shrink_n: 3
  weight_platforms: [youtube, instagram]   # whose views set the topic and hook weights; Facebook Page reels are
                                # pulled and kept too, but the Page has no audience yet (0-3 plays a reel)
  pull_days: 30                 # a pull asks about the reels posted within this many days (older numbers have settled)

selector:
  exploit_share: 0.7
  retire_after: 3

autopilot:                      # AUTOPILOT=true in .env (the default): no approvals; jobs run from systemd timers (deploy/)
  scoring_since: "2026-10-14"   # Instagram posts since the account became Graphony are the data (Facebook is ignored)
  old_format_weight: 0.5        # a post made with an older video.format_version counts half
  snapshot_hours: [24, 72]      # insights snapshots at about these ages; the outcome is the 72 h views, estimated from
                                # the 24 h ones (times the account's typical 72 h / 24 h ratio) for younger reels
  breakout_multiple: 5          # BREAKOUT = 72 h views >= max(breakout_multiple x median 72 h views of the last
  breakout_floor: 500           # breakout_window posts, breakout_floor). Views are bimodal: a breakout or a ~150 floor
  breakout_window: 30
  prior_strength: 4             # Beta-Binomial prior: worth 4 posts, centred on the account's breakout rate
  exploit_min_posts: 4          # a category is exploited once it has this many scored posts; below, it is explored
  retire_min_posts: 6           # retired from exploit with >= 6 posts and the 90% upper credible bound of its breakout
  retire_quantile: 0.9          # rate below half the base rate ...
  retry_days: 30                # ... and explored once more this long after it was retired
  anchor_day: "2026-10-27"      # slot 1 is the EXPLOIT post on this day and every 2nd day after it, slot 2 the days
                                # between (the other slot is the EXPLORE post), so the slot time never confounds them
  late_minutes: 90              # a post job refuses to run this long after its slot time ...
  min_gap_minutes: 60           # ... or this soon after the previous post
  pool_target: 10               # the daily generation run tops the ready pool up to this many reels ...
  pool_max_new: 5               # ... making at most this many
  pool_min_explore: 3           # ... keeping at least this many reels of explore-eligible categories
  pool_max_losses: 5            # POOL_MAX_LOSSES: a reel eligible and not picked on this many days is dropped
  posted_media_days: 14         # a posted reel's video and audio files are deleted this many days after it posted
  min_free_gb: 5                # below this much free disk generation pauses (posting goes on) and an alert goes out
  discover_below: 5             # fewer untested categories than this in the topic catalog: discover new ones
  discover_per_week: 3          # ... at most this many new categories a week (World Bank / OWID catalogs)
  cold_open_min: 0.2            # a new reel's chance of a cold open stays between these
  cold_open_max: 0.8
  alert_every_hours: 12         # the same alert goes out at most once per 12 h
  insights_fail_hours: 48       # Instagram insights failing this long is an alert
  token_warn_days: 7            # the Meta token expiring within this many days is an alert
  length_buckets: [21.5, 23.35]   # reel length feature: short below 21.5 s, mid up to 23.35 s, long above (cold open)

dashboard:
  host: 127.0.0.1               # never 0.0.0.0; use an SSH tunnel on a server
  port: 5055

# ~46 globally recognisable countries on every continent. iso2 is the flag-icons file name.
