# Curated topics. `python run.py topics-verify` fetches every active topic and comments out
# (with a reason) any that cannot produce a video. Keep each topic block starting with "- id:".
#
# source: worldbank -> code is a WDI indicator code
# source: owid      -> code is "<grapher-slug>/<column>" or "github:<energy-data|co2-data>/<column>"
# subtitle is shown on screen and must say what the number IS.
# value_scale (optional) multiplies raw values before unit_format, e.g. 1.0e-6 for millions.
# category is used only for the dashboard.

# ------------------------------------------------------------------ economy
- id: inflation
  category: economy
  source: worldbank
  code: FP.CPI.TOTL.ZG
  title: "If inflation had a sound"
  subtitle: "Consumer prices, % rise vs the year before"
  unit_format: "{:.1f}%"
  start_year: 1990
  min_meaningful: 2.0
  modelled_data_warning: false

- id: gdp_growth
  category: economy
  source: worldbank
  code: NY.GDP.MKTP.KD.ZG
