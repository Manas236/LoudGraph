{% extends "base.html" %}
{% block title %}Pipeline{% endblock %}
{% block body %}
<style>
  .topbar { display:flex; flex-wrap:wrap; gap:8px 14px; align-items:center; margin-bottom:12px; }
  .topbar .legend { display:flex; flex-wrap:wrap; gap:4px 8px; align-items:center; }

  /* health panel */
  .health { display:grid; grid-template-columns: minmax(0,2fr) repeat(3, minmax(0,1fr)); gap:10px; margin-bottom:14px; }
  .tile { background:var(--panel); border-radius:8px; padding:10px 12px; min-width:0; }
  .tile h3 { margin:0 0 6px; font-size:12px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted);
             display:flex; justify-content:space-between; gap:8px; }
  .tile .big { font-size:20px; font-weight:650; }
  .tile .big.ok { color:var(--ok); } .tile .big.bad { color:var(--bad); }
  .creds { list-style:none; margin:0 0 8px; padding:0; display:grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap:4px 12px; }
  .creds li { display:flex; gap:6px; align-items:center; min-width:0; }
  .creds li b { font-weight:600; }
  .st { font-size:11px; padding:0 7px; border-radius:99px; background:#222a38; color:var(--muted); white-space:nowrap; }
  .st-ok { background:#123b2c; color:var(--ok); }
  .st-missing { background:#3b3012; color:var(--warn); }
  .st-expired, .st-invalid, .st-error { background:#3e1a22; color:var(--bad); }
  .tile form { display:inline; } .tile button { padding:3px 10px; font-size:12px; }
  .meter { height:5px; background:#222a38; border-radius:99px; overflow:hidden; margin-top:6px; }
  .meter span { display:block; height:100%; background:var(--accent); }

  /* lanes: one row on wide screens, wrapping on medium ones, stacked on phones */
  .lanes { display:grid; grid-template-columns: repeat(7, minmax(200px, 1fr)); gap:10px; overflow-x:auto; padding-bottom:8px; align-items:start; }
  .lane { background:var(--panel); border-radius:8px; padding:8px; min-width:0; }
  .lane h3 { margin:2px 2px 8px; font-size:12px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); display:flex; justify-content:space-between; }
  .lane-waiting { outline:1px solid #1e6b4f; } .lane-failed h3 { color:var(--bad); } .lane-shipped h3 { color:var(--ok); }
  .empty, .more { margin:4px 2px; font-size:12px; color:var(--muted); }

  .card { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:8px; margin-bottom:8px; }
  .card:hover { border-color:#33405a; }
  .cardlink { display:block; color:var(--text); }
  .cardlink.has-thumb { display:grid; grid-template-columns: 48px minmax(0,1fr); gap:2px 8px; align-items:start; }
  .cardlink img { grid-row: span 2; width:48px; aspect-ratio:9/16; object-fit:cover; border-radius:4px; background:#000; }
  .cardlink .ttl { font-weight:600; line-height:1.25; display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; overflow-wrap:anywhere; }
  .cardlink .sub { display:block; font-size:12px; color:var(--muted); overflow-wrap:anywhere; }
  .doing { margin-top:6px; font-size:12px; color:var(--info); }
  .doing.stalled { color:var(--warn); }
  .sent { margin-top:6px; font-size:12px; }
  .sent .ok { color:var(--ok); }
  .err { margin-top:6px; font-size:12px; color:var(--bad); overflow-wrap:anywhere; }
  .card form { margin-top:6px; } .card form button { padding:3px 10px; font-size:12px; }
  .foot { display:flex; justify-content:space-between; align-items:center; gap:6px; margin-top:8px; }
  .age { font-size:11px; color:var(--muted); white-space:nowrap; }

  .chips { display:flex; gap:4px; flex-wrap:wrap; }
  .chip { display:inline-block; font-size:11px; font-weight:650; padding:1px 7px; border-radius:5px; border:1px solid transparent;
          background:#222a38; color:var(--muted); line-height:1.5; }
  .c-none { opacity:.35; }
  .c-pending { background:#222a38; color:var(--muted); }
  .c-uploading { background:#13284a; color:var(--info); border-color:#24477d; }
  .c-live { background:#123b2c; color:var(--ok); border-color:#1e6b4f; }
  .c-private-locked { background:#3b3012; color:var(--warn); border-color:#6b5520; }
  .c-private-locked::after { content:" 🔒"; font-size:9px; }
  .c-dry-run { background:transparent; color:var(--muted); border:1px dashed #4a5468; }
  .c-failed { background:#3e1a22; color:var(--bad); border-color:#6b2433; }
  a.chip:hover { filter:brightness(1.25); }

  @media (max-width: 1200px) {
    .lanes { grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); overflow-x:visible; }
  }
  @media (max-width: 900px) {
    .health { grid-template-columns: repeat(3, minmax(0,1fr)); }
    .health .tile:first-child { grid-column: 1 / -1; }
  }
  @media (max-width: 560px) {
    .health { grid-template-columns: 1fr 1fr; }
    .lanes { grid-template-columns: 1fr; }
    .topbar .legend { display:none; }
  }
</style>
<div class="topbar">
  <form method="post" action="{{ url_for('make_video') }}"><input type="hidden" name="csrf" value="{{ csrf }}"><button class="go">🎬 Make a video now</button></form>
  <span class="legend small muted">Post status:
    <span class="chip c-pending">pending</span><span class="chip c-uploading">uploading</span><span class="chip c-live">live</span><span class="chip c-private-locked">private-locked</span><span class="chip c-dry-run">dry-run</span><span class="chip c-failed">failed</span>
  </span>
</div>
<div id="board">{% include "_board_cols.html" %}</div>
<script>
  // Live board: every 2 s while something is being made, otherwise every 5 s.
  (function () {
    const url = "{{ url_for('board_fragment') }}";
    const el = document.getElementById("board");
    const busy = () => !!el.querySelector("[data-busy='1']");
    async function tick() {
      try {
        const r = await fetch(url, { cache: "no-store" });
        if (r.ok) el.innerHTML = await r.text();
      } catch (e) {}
      setTimeout(tick, busy() ? 2000 : 5000);
    }
    setTimeout(tick, busy() ? 2000 : 5000);
  })();
</script>
{% endblock %}
