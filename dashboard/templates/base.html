<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="csrf-token" content="{{ csrf }}">
<title>{% block title %}Review{% endblock %} · {{ brand }}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='dashboard.css') }}"><script src="{{ url_for('static', filename='dashboard.js') }}" defer></script>
</head><body data-page="{{ request.endpoint }}">
<header class="topbar"><div class="header-inner"><a href="/" class="brand"><span class="brand-symbol" aria-hidden="true">▥</span> {{ brand }}</a>
<nav aria-label="Main navigation"><a href="/" {{ 'aria-current=page' if request.endpoint == 'review' }}>Review</a><a href="/library" {{ 'aria-current=page' if request.endpoint == 'library' }}>Library</a><a href="/settings" {{ 'aria-current=page' if request.endpoint == 'settings' }}>Settings</a></nav>
<div id="status-line">{% include '_status.html' %}</div></div></header>
<main>{% block body %}{% endblock %}</main>
<div id="toast" class="toast" role="status" aria-live="polite" hidden>{% for message in get_flashed_messages() %}{{ message }}{% endfor %}</div>
</body></html>
